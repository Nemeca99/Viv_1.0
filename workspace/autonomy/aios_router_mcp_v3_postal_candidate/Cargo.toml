[package]
name = "aios-router-mcp-v3-postal-candidate"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
sha2 = "0.10"
getrandom = "0.4"
aes-gcm = "0.10"
rand = "0.8"

